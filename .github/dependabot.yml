version: 2

updates:
  - package-ecosystem: gomod
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps-go)'

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps-npm)'
    # TypeScript 7 saiu do intervalo de peer do SvelteKit 3 (`^6.0.0`) e removeu
    # a API de compilador que o kit consome (svelte.dev/e/kit/typescript_compiler_api_missing).
    # Mantemos a linha 6.x até o SvelteKit suportar o 7.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps-cargo)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(docker)'
