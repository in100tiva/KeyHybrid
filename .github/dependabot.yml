version: 2

updates:
  - package-ecosystem: gomod
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps-go)'

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps-npm)'

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps-cargo)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(docker)'
