name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Menor privilégio no nível do workflow; escrita só no job de publicação.
permissions:
  contents: read

jobs:
  binaries:
    name: Binário ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/server/go.mod

      - name: Compilar gateway
        working-directory: apps/server
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          name="keyhybrid-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -tags no_ui -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o "dist/${name}${ext}" .

      - name: Guardar binário
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyhybrid-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apps/server/dist/*
          if-no-files-found: error

  desktop:
    name: Instalador desktop (${{ matrix.os }})
    # Tag de pré-release (v0.3.0-rc.1): o MSI só aceita X.Y.Z, então os instaladores ficam
    # de fora e a release sai só com o gateway, como antes.
    if: ${{ !(startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 dá ao .deb a glibc mais antiga (2.35), compatível com Ubuntu 22.04+ e Debian 12+.
          - { os: ubuntu-22.04, bundles: deb, artifact: desktop-linux }
          - { os: windows-latest, bundles: 'msi,nsis', artifact: desktop-windows }
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependências do sistema
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Configurar Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/server/go.mod

      - name: Configurar pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Versão do instalador
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version=$(bash ../../.github/scripts/desktop-version.sh "$REF" src-tauri/tauri.conf.json)
          printf '{"version":"%s"}\n' "$version" > "$RUNNER_TEMP/tauri.version.json"
          echo "$version"

      - name: Compilar instalador
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          if [ "$BUNDLES" = "deb" ]; then
            pnpm tauri build --bundles deb --config src-tauri/tauri.deb.conf.json --config "$RUNNER_TEMP/tauri.version.json"
          else
            pnpm tauri build --bundles msi,nsis --config "$RUNNER_TEMP/tauri.version.json"
          fi

      - name: Conferir servidor dentro do .deb
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          dpkg-deb -c "$deb" | tee "$RUNNER_TEMP/deb.txt"
          grep -qE '^-rwx.* (\./)?usr/lib/KeyHybrid/server/keyhybrid-server$' "$RUNNER_TEMP/deb.txt" \
            || { echo "::error::.deb sem usr/lib/KeyHybrid/server/keyhybrid-server executável"; exit 1; }
          grep -qE '^-rwx.* (\./)?usr/bin/keyhybrid$' "$RUNNER_TEMP/deb.txt" \
            || { echo "::error::.deb sem usr/bin/keyhybrid"; exit 1; }
          pkg=$(dpkg-deb -f "$deb" Package)
          test "$pkg" = key-hybrid || { echo "::error::pacote '$pkg', esperado key-hybrid"; exit 1; }

      # Com vários padrões no upload, o artifact guardaria deb/, msi/ e nsis/ como subpastas
      # e o `sha256sum KeyHybrid_*` do job release não acharia nada na raiz de dist/.
      - name: Juntar instaladores
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/instaladores"
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name 'KeyHybrid_*.deb' -o -name 'KeyHybrid_*.msi' -o -name 'KeyHybrid_*-setup.exe' \) \
            -exec cp {} "$RUNNER_TEMP/instaladores/" \;
          ls -l "$RUNNER_TEMP/instaladores"

      - name: Guardar instalador
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/instaladores/*
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [binaries, desktop]
    # workflow_dispatch só ensaia o build; publicar é coisa de tag.
    # desktop pulado (pré-release) não pode bloquear a publicação do gateway.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.binaries.result == 'success'
      && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Baixar binários e instaladores
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Gerar checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob  # pré-release: sem KeyHybrid_*
          sha256sum keyhybrid-server-* KeyHybrid_* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Procedência assinada pelo GitHub (keyless, via OIDC) para cada binário.
      - name: Atestar procedência dos binários
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      # O bundle é anexado ao release para que qualquer pessoa possa conferir
      # a origem com `gh attestation verify --bundle provenance.intoto.jsonl`.
      - name: Anexar bundle de procedência
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE"
          cp "$BUNDLE" dist/provenance.intoto.jsonl
          ls -l dist/provenance.intoto.jsonl

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: KeyHybrid ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
